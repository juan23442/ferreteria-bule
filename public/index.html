<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ferretería El Bule - Inventario</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; background: #f4f4f9; }
    h1 { color: #333; }
    form { background: #fff; padding: 15px; border-radius: 5px; margin-bottom: 20px; display: flex; gap: 10px; }
    input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 8px 15px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background: #007bff; color: white; }
    .btn-delete { background: #dc3545; }
  </style>
</head>
<body>

  <h1>Inventario - Ferretería El Bule</h1>

  <form id="productForm">
    <input type="text" id="codigo" placeholder="Código" required>
    <input type="text" id="nombre" placeholder="Nombre" required>
    <input type="number" step="0.01" id="precio" placeholder="Precio" required>
    <input type="number" id="stock" placeholder="Stock" required>
    <button type="submit">Agregar</button>
  </form>

  <table>
    <thead>
      <tr>
        <th>Código</th>
        <th>Nombre</th>
        <th>Precio</th>
        <th>Stock</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="tablaProductos"></tbody>
  </table>

  <script>
    const API_URL = '/api/productos';

    async function cargarProductos() {
      const res = await fetch(API_URL);
      const productos = await res.json();
      const tbody = document.getElementById('tablaProductos');
      tbody.innerHTML = '';
      productos.forEach(p => {
        tbody.innerHTML += `
          <tr>
            <td>${p.codigo}</td>
            <td>${p.nombre}</td>
            <td>$${p.precio}</td>
            <td>${p.stock}</td>
            <td><button class="btn-delete" onclick="eliminarProducto(${p.id})">Eliminar</button></td>
          </tr>
        `;
      });
    }

    document.getElementById('productForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = {
        codigo: document.getElementById('codigo').value,
        nombre: document.getElementById('nombre').value,
        precio: parseFloat(document.getElementById('precio').value),
        stock: parseInt(document.getElementById('stock').value)
      };

      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });

      e.target.reset();
      cargarProductos();
    });

    async function eliminarProducto(id) {
      if (confirm('¿Eliminar producto?')) {
        await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
        cargarProductos();
      }
    }

    cargarProductos();
  </script>
</body>
</html>
